<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>One Answer – Student</title>
    <style>
        html, body { height: 100%; margin: 0; }
        #content { height: 100%; }
    </style>
    <script src="config.js"></script>
    <script id="sap-ui-bootstrap"
        src="resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-async="true"
        data-sap-ui-compat-version="edge"
        data-sap-ui-frame-options="trusted"
        data-sap-ui-libs="sap.m,sap.ui.core,sap.f,sap.ui.layout"
        data-sap-ui-resource-roots='{"zoa.zoarequestui": "./"}'
        data-sap-ui-on-init="module:zoa/zoarequestui/studentInit">
    </script>
</head>
<body class="sapUiBody sapUiSizeCozy" id="content">

    <!-- Top Right Corner User & Role Indicator (Role + User ID + Logout only) -->
    <div id="zoa-student-bar" style="position:fixed; top:10px; right:18px; z-index:99999; display:inline-flex; align-items:center; gap:8px; background:#FFFFFF; padding:4px 12px; border-radius:20px; box-shadow:0 2px 8px rgba(0,0,0,0.12); border:1px solid #CBD5E1; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size:12px; color:#1E293B; height:auto !important; max-height:36px !important;">
        <span style="display:inline-block; width:8px; height:8px; border-radius:50%; background:#10B981;"></span>
        <span id="zoa-student-name" style="font-weight:600; color:#0F172A;">STUDENT</span>
        <span style="color:#CBD5E1;">|</span>
        <a href="javascript:void(0)" onclick="zoaStudentLogout()" style="color:#DC2626; text-decoration:none; font-weight:500;">🚪 Logout</a>
    </div>

    <script>
        function zoaStudentLogout() {
            sessionStorage.removeItem("zoa_auth_session");
            fetch("/auth/logout", { method: "POST", credentials: "same-origin" })
                .catch(function () {})
                .finally(function () {
                    window.location.href = "login.html";
                });
        }

        (function () {
            var raw = sessionStorage.getItem("zoa_auth_session");
            if (raw) {
                try {
                    var sess = JSON.parse(raw);
                    var el = document.getElementById("zoa-student-name");
                    if (el) {
                        var role = (sess.role || "STUDENT").toUpperCase();
                        var uid = (sess.userId || "").toUpperCase();
                        el.innerText = role + (uid ? " (" + uid + ")" : "");
                    }
                } catch (e) {}
            }
        })();
    </script>
</body>
</html>
