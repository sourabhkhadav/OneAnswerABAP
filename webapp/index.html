<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>One Answer Requests</title>
    <style>
        html, body, body > div, #container, #container-uiarea {
            height: 100%;
        }
    </style>
    <script src="config.js"></script>
    <script
        id="sap-ui-bootstrap"
        src="resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-resource-roots='{
            "zoa.zoarequestui": "./",
            "zoa.zoarequestui.student": "./student"
        }'
        data-sap-ui-compat-version="edge"
        data-sap-ui-async="true"
        data-sap-ui-frame-options="trusted"
    ></script>
</head>
<body class="sapUiBody sapUiSizeCompact" id="content">

    <div
        data-sap-ui-component
        data-name="zoa.zoarequestui"
        data-id="container"
        data-settings='{"id" : "zoa.zoarequestui"}'
        data-handle-validation="true"
    ></div>

    <!-- Top Right Corner User & Role Indicator (Role + User ID + Logout only) -->
    <div id="zoa-authority-bar" style="position:fixed; top:10px; right:18px; z-index:99999; display:inline-flex; align-items:center; gap:8px; background:#FFFFFF; padding:4px 12px; border-radius:20px; box-shadow:0 2px 8px rgba(0,0,0,0.12); border:1px solid #CBD5E1; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size:12px; color:#1E293B; height:auto !important; max-height:36px !important;">
        <span style="display:inline-block; width:8px; height:8px; border-radius:50%; background:#10B981;"></span>
        <span id="zoa-user-name" style="font-weight:600; color:#0F172A;">AUTHORITY</span>
        <span style="color:#CBD5E1;">|</span>
        <a href="javascript:void(0)" onclick="zoaLogout()" style="color:#DC2626; text-decoration:none; font-weight:500;">🚪 Logout</a>
    </div>

    <script>
        function zoaLogout() {
            sessionStorage.removeItem("zoa_auth_session");
            fetch("/auth/logout", { method: "POST", credentials: "same-origin" })
                .catch(function () {})
                .finally(function () {
                    window.location.href = "login.html";
                });
        }

        function applyAuthorityBadge(sess) {
            var el = document.getElementById("zoa-user-name");
            if (el && sess) {
                var role = (sess.role || "AUTHORITY").toUpperCase();
                var uid = (sess.userId || "").toUpperCase();
                el.innerText = role + (uid ? " (" + uid + ")" : "");
            }
        }

        function bootAuthorityApp() {
            sap.ui.getCore().attachInit(function () {
                sap.ui.require(["sap/ui/core/ComponentSupport"]);
            });
        }

        (function () {
            fetch("/auth/session", { credentials: "same-origin", cache: "no-store" })
                .then(function (res) {
                    if (res.status === 404) {
                        var raw = sessionStorage.getItem("zoa_auth_session");
                        if (raw) {
                            try { applyAuthorityBadge(JSON.parse(raw)); } catch (e) {}
                        }
                        bootAuthorityApp();
                        return null;
                    }
                    return res.json();
                })
                .then(function (sess) {
                    if (!sess) { return; }
                    if (!sess.authenticated) {
                        sessionStorage.removeItem("zoa_auth_session");
                        window.location.replace("login.html");
                        return;
                    }
                    if (sess.isStudent) {
                        window.location.replace("student.html");
                        return;
                    }
                    sessionStorage.setItem("zoa_auth_session", JSON.stringify(sess));
                    applyAuthorityBadge(sess);
                    bootAuthorityApp();
                })
                .catch(function () {
                    window.location.replace("login.html");
                });
        })();
    </script>
</body>
</html>
