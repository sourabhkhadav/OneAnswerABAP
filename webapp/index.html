<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>One Answer Requests</title>
    <style>
        html, body, body > div, #container, #container-uiarea {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        header#zoa-user-corner {
            position: fixed;
            top: 10px;
            right: 16px;
            z-index: 99999;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            height: auto !important;
            max-height: 36px !important;
            padding: 4px 12px;
            background: #FFFFFF;
            border: 1px solid #CBD5E1;
            border-radius: 18px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 12px;
            color: #1E293B;
        }

        header#zoa-user-corner a {
            text-decoration: none;
            font-weight: 500;
        }

        header#zoa-user-corner a:hover {
            text-decoration: underline;
        }
    </style>
    <script src="config.js"></script>
    <script
        id="sap-ui-bootstrap"
        src="resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-resource-roots='{
            "zoa.zoarequestui": "./",
            "zoa.zoarequestui.student": "./student"
        }'
        data-sap-ui-on-init="module:sap/ui/core/ComponentSupport"
        data-sap-ui-compat-version="edge"
        data-sap-ui-async="true"
        data-sap-ui-frame-options="trusted"
    ></script>
</head>
<body class="sapUiBody sapUiSizeCompact" id="content">

    <!-- Minimal Top Right User & Role Indicator (Header tag, not div, so body > div does not stretch it) -->
    <header id="zoa-user-corner">
        <span style="display:inline-block; width:8px; height:8px; border-radius:50%; background:#10B981;"></span>
        <span id="zoa-user-name" style="font-weight:600; color:#0F172A;">HOD (S23AH18)</span>
        <span style="color:#CBD5E1;">|</span>
        <a href="student.html" style="color:#0070F2;">🎓 Student Portal</a>
        <span style="color:#CBD5E1;">|</span>
        <a href="javascript:void(0)" onclick="sessionStorage.removeItem('zoa_auth_session'); window.location.href='login.html'" style="color:#DC2626;">🚪 Logout</a>
    </header>

    <script>
        (function () {
            var raw = sessionStorage.getItem("zoa_auth_session");
            if (raw) {
                try {
                    var sess = JSON.parse(raw);
                    var el = document.getElementById("zoa-user-name");
                    if (el) {
                        var role = sess.role || "Authority";
                        var uid = sess.userId || "";
                        el.innerText = role + " (" + uid + ")";
                    }
                } catch (e) {}
            }
        })();
    </script>

    <div
        data-sap-ui-component
        data-name="zoa.zoarequestui"
        data-id="container"
        data-settings='{"id" : "zoa.zoarequestui"}'
        data-handle-validation="true"
    ></div>
</body>
</html>
