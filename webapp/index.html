<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>One Answer Requests</title>
    <style>
        html, body, body > div, #container, #container-uiarea {
            height: 100%;
        }
    </style>
    <script src="config.js"></script>
    <script
        id="sap-ui-bootstrap"
        src="resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-resource-roots='{
            "zoa.zoarequestui": "./",
            "zoa.zoarequestui.student": "./student"
        }'
        data-sap-ui-on-init="module:sap/ui/core/ComponentSupport"
        data-sap-ui-compat-version="edge"
        data-sap-ui-async="true"
        data-sap-ui-frame-options="trusted"
    ></script>
</head>
<body class="sapUiBody sapUiSizeCompact" id="content">

    <!-- Floating Authority Header Bar -->
    <div id="zoa-authority-bar" style="position:fixed; top:10px; right:18px; z-index:9999; display:flex; align-items:center; gap:10px; background:#FFFFFF; padding:6px 14px; border-radius:30px; box-shadow:0 4px 16px rgba(0,0,0,0.12); border:1px solid #CBD5E1; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size:13px;">
        <span id="zoa-user-badge" style="display:flex; align-items:center; gap:6px; color:#1E293B; font-weight:600;">
            <span style="display:inline-block; width:8px; height:8px; border-radius:50%; background:#10B981;"></span>
            Authority: <span id="zoa-user-name" style="color:#0070F2;">HOD (S23AH18)</span>
        </span>
        <span style="color:#CBD5E1;">|</span>
        <button onclick="window.location.href='student.html'" style="background:#EFF6FF; border:1px solid #BFDBFE; border-radius:14px; padding:4px 10px; cursor:pointer; font-size:12px; font-weight:600; color:#0070F2;">🎓 Student Portal</button>
        <button onclick="sessionStorage.removeItem('zoa_auth_session'); window.location.href='login.html'" style="background:#FEE2E2; border:1px solid #FCA5A5; border-radius:14px; padding:4px 10px; cursor:pointer; font-size:12px; font-weight:600; color:#DC2626;">🚪 Logout</button>
    </div>

    <script>
        (function () {
            var raw = sessionStorage.getItem("zoa_auth_session");
            if (raw) {
                try {
                    var sess = JSON.parse(raw);
                    var el = document.getElementById("zoa-user-name");
                    if (el) {
                        el.innerText = (sess.roleTitle || sess.role || "Authority") + " (" + (sess.userId || "") + ")";
                    }
                } catch (e) {}
            }
        })();
    </script>

    <div
        data-sap-ui-component
        data-name="zoa.zoarequestui"
        data-id="container"
        data-settings='{"id" : "zoa.zoarequestui"}'
        data-handle-validation="true"
    ></div>
</body>
</html>
